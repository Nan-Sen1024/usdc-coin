candidate_experiments:
  - id: entry-density-hard-block-under-rebalance-pressure
    status: deployed_on_live_not_active_current_regime
    hypothesis: >
      When entry profit density has already degraded to the hard threshold and the
      opposite-side rebalance leg is still waiting to release inventory, suppressing
      fresh entry overlay should improve realized profit density and free turnover
      for the profitable rebalance leg.
    change_surface:
      - strategy filter
      - existing profit-density signal
    validation:
      - focused strategy regression tests
      - no touched-path test regressions
      - no promotion beyond code candidate without replay or shadow evidence
  - id: live-sell-drought-release-acceleration
    status: superseded_not_selected
    hypothesis: >
      On live, profitability is currently constrained more by rebalance release not
      clearing inventory for hours than by extra entry churn, so the next high-value
      mutation should improve sell-side release probability without stepping outside
      the existing guardrails.
    change_surface:
      - rebalance release sizing geometry
      - existing drought guard state
    validation:
      - keep release price concession unchanged
      - only relax excess-only sizing while same-side drought guard is active in release mode
      - preserve existing non-drought release behavior
    evidence:
      - in a local near-live replay state with strategy_position_base 2746.24231 and entry_base_size 2000, current logic limited release sell size to 746.24231 because excess-only stayed active under sell_drought
      - the patched challenger keeps the same release ask price 1.0004 but expands size to 2000 under the same drought state
      - recent live audit rows now confirm the current live decision target is exactly ask_price 1.0004 and ask_size 746.24231
      - targeted regression passed and existing release-sell control tests still passed
      - this experiment was superseded once live audit and live_position_lots confirmed that price, not size, is the dominant active constraint
  - id: live-drought-release-extra-negative-tick
    status: deployed_on_live_under_observation
    hypothesis: >
      The stronger live bottleneck may be the release price floor itself: with the
      current inventory lots all priced at 1.0005, rebalance_release_max_negative_ticks=1
      pins the release floor at 1.0004, one tick above the live best ask 1.0003, so
      the order can rest for hours without turnover.
    change_surface:
      - rebalance release pricing geometry
      - drought-specific release concession
    validation:
      - confirm from current live lot prefix that both 746-base and 2000-base release slices share the same 1.0004 floor under negative_tick=1
      - quantify the realized edge sacrifice of moving the drought release floor to 1.0003
      - do not promote without explicit evidence that turnover gain outweighs the extra realized loss
    evidence:
      - remote live code now contains the drought extra negative tick helper and the current managed sell order is indeed at 1.0003
      - after deployment, the market moved one more tick lower to 1.0002 best ask, so the release order is again one tick above the market
      - the deployment therefore improved release pricing by one tick but did not eliminate the underlying inventory mark-to-market sensitivity
      - current live lot prefix still confirms the cost floor is 1.0005 for the whole 2746.24231 long inventory, so even 1.0003 remains below cost and 1.0002 would require another tick of realized concession
  - id: progressive-drought-release-concession
    status: challenger_coded_locally_not_deployed
    hypothesis: >
      Once sell_drought or buy_drought is active, keeping the extra release concession
      fixed at one tick leaves aged inventory stranded above the market for too long.
      Scaling drought-only extra negative ticks with drought duration should improve
      release turnover without changing drought trigger thresholds or release sizing.
    change_surface:
      - drought-specific release pricing geometry
      - existing managed fill age signal
    validation:
      - keep the first drought window at the current one-extra-tick behavior
      - cap drought-only extra negative ticks at three
      - preserve non-drought release behavior and release sizing geometry
      - require focused drought/release regression and full strategy regression before any live promotion
    evidence:
      - current active live analysis showed a 2026-04-03 19:57:51 +08 release sell parked at 1.0003 while best_ask was 1.0001, with no fills since 2026-04-01 16:14:09 +08
      - the deployed single extra drought tick improved release pricing once, but did not keep pace with a longer no-fill drought
      - the strategy already tracks managed rebalance fill age, so drought duration can be promoted into a bounded price-only concession without changing trigger windows or release size

external_benchmark_review:
  as_of: 2026-04-01
  subject: binance_okx_arbitrage_and_market_making_report
  decision: borrow_selected_components_not_full_strategy_replacement
  confirmed_strengths:
    - the report is directionally correct that cross-venue and carry systems should read instrument rules fees and funding fields dynamically instead of hard-coding them
    - the report is directionally correct that post-only discipline execution deadlines and hedge timeout logic are first-order for cross-venue profitability
    - the report is directionally correct that market-making backtests need order-book aware replay to avoid optimistic fill assumptions
  better_than_bot6_in:
    - explicit all-in cost accounting that decomposes gross edge fees slippage carry and hedge gap before entry
    - broader strategy surface including perp-perp spread funding carry and maker-hedge hybrids
    - stronger infra checklist for dual-venue execution logging monitoring and replay
  not_better_than_bot6_in:
    - immediate deployability inside the current codebase because bot6 is still a spot cash micro-maker rather than a dual-venue derivatives OMS
    - local execution realism for the current live bottleneck because the dominant observed issue is stalled release turnover not missing perp alpha
    - risk simplicity because perp carry and maker-hedge add liquidation funding and hedge-gap risk that bot6 does not currently model
  borrow_now:
    - add benchmark-style all-in executable edge thresholds to read-only cross-venue observers before any live expansion
    - rank venue reliability and execution completeness as first-class factors alongside spread and fee drag
    - keep strategy family separation explicit: stablecoin spot making remains bot6, perp or funding carry should start as a parallel module or new project
  defer_for_new_project:
    - cross-exchange perp-perp arbitrage
    - funding-carry execution and settlement accounting
    - maker-on-one-venue hedge-on-another-venue inventory engine

