        - current live bot is already buy-suppressed by sell_drought guard, so that local patch is not the first-order live lever right now
    - name: public_stream_instability
      status: secondary_confirmed_but_not_current_primary
      evidence:
        - local sim latest run spent most events in PAUSED with repeated public stream reconnects
        - recent live audit still contains reconnect and stream_error events, but the bot is currently quoting and holding one live sell order, so stream health is not the first-order blocker right now
  secondary_bottleneck: intermittent_stream_interruptions_and_resyncs
  secondary_bottleneck_evidence:
    - recent live audit rows include reconnect, stream_error, and resync_complete events around the current run
    - private_user last activity lags far behind public_books5 in the latest snapshot, so stream asymmetry remains a reliability risk
  first_principles_note:
    target_function: maximize realized pnl density first, then turnover
    base_equation: net profitability = realized edge per unit turnover x turnover rate - execution and carry drag
    live_failure_term:
      - current live realized edge is not the immediate limiter because there were zero fills in the recent density windows
      - turnover rate is the immediate limiter because the bot spent about 4.49 hours without a new fill while inventory remained above the drought threshold
    causal_hypothesis:
      - sell_drought guard removes fresh buy participation once rebalance sell starvation is detected
      - the remaining rebalance sell path is currently bounded by a one-tick-below-cost release floor, which leaves the active order one tick above the live best ask
      - because the order target remains unchanged at that price and size, the executor preserves the resting order instead of refreshing turnover

